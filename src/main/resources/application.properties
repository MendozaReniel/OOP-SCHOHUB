# ------------------------------------------------------------------
# SchoHub backend configuration
# ------------------------------------------------------------------
server.port=8080

# Persistent file-based H2 database (data survives restarts, like a real DB).
# schohub.data.dir is resolved at startup by SchoHubApplication to this project's own
# data folder, so accounts are the same whichever directory or browser opens the site.
spring.datasource.url=jdbc:h2:file:${schohub.data.dir:./data}/schohub;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Browser console for inspecting tables: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JSON: hide null fields of DTOs that are not applicable to the active branch
spring.jackson.default-property-inclusion=non_null

# Session lifetime (the flowchart's "persistent session, retained on browser exit")
app.session.ttl-days=30

# Frontend dev origins allowed to call this API
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:5500,http://127.0.0.1:5500,http://127.0.0.1:8080
